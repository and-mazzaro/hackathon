name: ecoquest
description: "EcoQuest - educazione ambientale con un cucciolo virtuale"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + dependency injection (plain Notifier, no codegen).
  flutter_riverpod: ^3.4.3
  # Navigation: bottom-tab shell, Android back button, deep links later.
  go_router: ^18.1.1
  # Material Design widgets (moved out of the Flutter framework in 2026).
  material_ui: ^1.8.0
  # Number/date formatting for Italian; version is pinned by flutter_localizations.
  intl: any
  # Finds the app's private folder for the save file (Android/iOS).
  path_provider: ^2.1.6
  # Cuts text by visible characters, so emoji are never split in half.
  # Already part of Flutter; listed because we import it directly.
  characters: ^1.4.1
  # Sound effects, music and ambience loops (Android + iOS). Only used
  # behind AudioBackend in lib/core/audio/, never directly by screens.
  audioplayers: ^6.8.1
  # Opt-in daily reminder (M10), scheduled on the phone, no server push.
  # Only used behind ReminderScheduler in lib/core/notifications/.
  flutter_local_notifications: ^22.3.2
  # Time zones for the daily reminder time (needed by zonedSchedule).
  timezone: ^0.11.2
  # Reads the phone's time zone name (e.g. Europe/Rome).
  flutter_timezone: ^5.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets tests move time forward (music ducking, sound cooldowns).
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from the .arb files.
  generate: true

  # Educational content (questions, facts, ...) as JSON files.
  assets:
    - assets/content/
    # Sounds: one line per folder (Flutter does not include subfolders).
    # Licences in assets/audio/ATTRIBUTION.md.
    - assets/audio/ambience/
    - assets/audio/pet/
    - assets/audio/quiz/
    - assets/audio/recycling/
    - assets/audio/rewards/
    - assets/audio/ui/

  fonts:
    # Nunito, SIL Open Font License 1.1 (see assets/fonts/OFL.txt).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
